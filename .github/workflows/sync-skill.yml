# 日常入口：push 到 main 且改到 SKILL.md。
# workflow_dispatch 只用于测试或补跑，不是日常入口。
name: Sync write-like-a-person

on:
  push:
    branches:
      - main
    paths:
      - SKILL.md
  workflow_dispatch:

concurrency:
  group: sync-write-like-a-person
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the skill
        uses: actions/checkout@v5

      - name: Check for the sync token
        id: token
        env:
          TOKEN: ${{ secrets.KAZ_SYNC_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KAZ_SYNC_TOKEN is not set; skipping the sync. Add the secret and re-run this workflow."
          fi

      - name: Check out the Kaz preset
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          repository: Kaczev/dsh-KazMode
          token: ${{ secrets.KAZ_SYNC_TOKEN }}
          path: kaz-repo

      - name: Set up Node
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync the skill into the preset
        if: steps.token.outputs.present == 'true'
        working-directory: kaz-repo
        run: node scripts/sync-skill.mjs --from "$GITHUB_WORKSPACE"

      - name: Commit and push if the copy changed
        if: steps.token.outputs.present == 'true'
        working-directory: kaz-repo
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaz/skills/write-like-a-person
          git commit -m "chore: sync write-like-a-person from ${GITHUB_SHA::7}"
          git push
